services:
  app:
    build: .
    container_name: meuplayer
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
      MEUPLAYER_USER_DATA: /data
      MEUPLAYER_STATIC_DIR: /app/public
    ports:
      # Host → container (app escuta 3000 dentro do container)
      # 8765 costuma estar ocupada pelo Electron/go local; use 3000 no Docker
      - "3000:3000"
    volumes:
      - meuplayer_data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  meuplayer_data:
