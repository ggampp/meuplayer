<!doctype html>
<html lang="pt-BR" class="player-shell">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MeuPlayer · Plataforma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,144,400;1,144,500&family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/css/player-shell.css?v=bv1" />
  </head>
  <body class="player-shell">
    <script type="module" src="/js/nav.js"></script>

    <div class="super-player" id="superPlayer">
      <div class="player-toolbar" role="toolbar" aria-label="Controles da plataforma">
        <div class="player-toolbar__meta">
          <span class="player-toolbar__badge">Streaming</span>
          <span class="player-toolbar__title" id="playerTitle">Plataforma</span>
        </div>
        <div class="player-toolbar__actions">
          <button type="button" class="player-toolbar__btn" id="btnBack" title="Voltar" aria-label="Voltar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <button type="button" class="player-toolbar__btn" id="btnForward" title="Avançar" aria-label="Avançar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
          <button type="button" class="player-toolbar__btn" id="btnReload" title="Recarregar" aria-label="Recarregar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          </button>
          <button type="button" class="player-toolbar__btn" id="btnHome" title="Catálogo MeuPlayer" aria-label="Ir para o catálogo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          </button>
          <button type="button" class="player-toolbar__btn" id="btnOpenExternal" title="Abrir no navegador" aria-label="Abrir no navegador externo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </button>
          <button type="button" class="player-toolbar__btn" id="btnFullscreen" title="Tela cheia" aria-label="Tela cheia">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
          </button>
        </div>
      </div>

      <div class="player-viewport" id="playerViewport">
        <div class="player-loading" id="playerLoading" role="status" aria-live="polite">
          <div class="player-loading__spinner" aria-hidden="true"></div>
          <span class="player-loading__text" id="playerLoadingText">Carregando plataforma…</span>
        </div>
      </div>
    </div>

    <script type="module" src="/js/provider-modal.js"></script>
    <script type="module" src="/js/player.js"></script>
  </body>
</html>
